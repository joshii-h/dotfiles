# GTK 4 – gleicher Look in niri und Plasma: adw-gtk3-dark, Papirus mit
# Akzentordnern, Bibata. Die Farben kommen aus gtk.css (dank-colors.css, von
# DMS/matugen aus dem Hintergrundbild erzeugt). Unter Wayland lesen GTK-Apps
# zusätzlich die gleichen Werte aus gsettings (run_onchange …dateimanager…).
# KDE schreibt diese Datei nicht mehr (kded-Modul gtkconfig ist aus).
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark-Akzent
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-font-name=Google Sans Flex 10
gtk-decoration-layout=:close
gtk-enable-animations=true
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=freedesktop
