<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Standardschriften der Battlestation (wie in DMS und den bekannten Rices):
  Oberfläche Google Sans Flex, Code JetBrains Mono, Icons aus Symbols Nerd Font,
  Emoji aus Noto Color Emoji. Kantenglättung/Hinting bleiben systemweit (/etc/fonts).
  Google Sans Flex kopiert `dms-update` aus der Shell nach ~/.local/share/fonts.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- Programme, die direkt nach Arial/Helvetica fragen, bekommen weiter
       die metrisch passende Liberation Sans (sonst verrutschen Layouts). -->
</fontconfig>
