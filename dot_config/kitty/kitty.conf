# Schrift: JetBrains Mono (ungepatcht, mit Ligaturen); Nerd-Font-Symbole
# kommen per symbol_map aus „Symbols Nerd Font Mono“ (media-fonts/symbols-nerd-font).
font_family      family="JetBrains Mono" style=Light
bold_font        family="JetBrains Mono" style=Bold
italic_font      family="JetBrains Mono" style="Light Italic"
bold_italic_font family="JetBrains Mono" style="Bold Italic"
font_size        12.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Ghostty color scheme (Tomorrow Night variant)
background #282c34
foreground #ffffff

color0  #1d1f21
color1  #cc6666
color2  #b5bd68
color3  #f0c674
color4  #81a2be
color5  #b294bb
color6  #8abeb7
color7  #c5c8c6
color8  #666666
color9  #d54e53
color10 #b9ca4a
color11 #e7c547
color12 #7aa6da
color13 #c397d8
color14 #70c0b1
color15 #eaeaea

# Cursor
cursor #ffffff
cursor_text_color #282c34

# Selection
selection_foreground #282c34
selection_background #c5c8c6

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #81a2be
active_tab_foreground #282c34
inactive_tab_background #1d1f21
inactive_tab_foreground #c5c8c6

# Shell
shell /bin/zsh

# Window
window_padding_width 4
confirm_os_window_close 0

# Wayland
wayland_titlebar_color background
linux_display_server wayland

# Farben aus dem Hintergrundbild (DankMaterialShell/matugen, nur auf der
# Battlestation vorhanden). Steht am Ende und überschreibt Tomorrow Night;
# fehlen die Dateien (Fedora), greift globinclude einfach ins Leere.
globinclude dank-*.conf
