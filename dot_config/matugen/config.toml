# Eigene matugen-Vorlagen – DMS führt sie bei jedem Hintergrund-/Farbwechsel
# mit aus (Einstellung „runUserMatugenTemplates“). Farben im dunklen Modus.
[config]

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.lazygit]
input_path = "~/.config/matugen/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.uosc]
input_path = "~/.config/matugen/templates/mpv-uosc.conf"
output_path = "~/.config/mpv/dms-uosc.conf"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

# Akzentfarbe für die Papirus-Ordner (ordner-symbole wählt die nächstliegende
# Papirus-Farbe, baut nur bei Farbwechsel neu) die Razer-LEDs (rgb-razer) und die Corsair-LEDs über CoolerControl (rgb-coolercontrol).
[templates.ordnerfarbe]
input_path = "~/.config/matugen/templates/akzent.txt"
output_path = "~/.cache/matugen/akzent"
post_hook = 'sh -c "($HOME/.local/bin/ordner-symbole --auto; $HOME/.local/bin/rgb-razer; $HOME/.local/bin/rgb-coolercontrol) >/dev/null 2>&1 &"'
