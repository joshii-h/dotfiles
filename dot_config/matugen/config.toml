# Eigene matugen-Vorlagen – DMS führt sie bei jedem Hintergrund-/Farbwechsel
# mit aus (Einstellung „runUserMatugenTemplates“). Farben im dunklen Modus.
[config]

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.lazygit]
input_path = "~/.config/matugen/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.uosc]
input_path = "~/.config/matugen/templates/mpv-uosc.conf"
output_path = "~/.config/mpv/dms-uosc.conf"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

# Akzentfarbe für die Papirus-Ordner: ordner-symbole wählt die nächstliegende
# Papirus-Farbe und baut „Papirus-Dark-Akzent“ nur bei Farbwechsel neu.
[templates.ordnerfarbe]
input_path = "~/.config/matugen/templates/akzent.txt"
output_path = "~/.cache/matugen/akzent"
post_hook = 'sh -c "$HOME/.local/bin/ordner-symbole --auto >/dev/null 2>&1 &"'

# Palette für die RGB-Beleuchtung: rgb-sync (Autostart) bemerkt die Änderung
# selbst und blendet alle LEDs zwischen kräftigen Varianten dieser Farben über.
[templates.rgbpalette]
input_path = "~/.config/matugen/templates/rgb-palette.json"
output_path = "~/.cache/matugen/rgb-palette.json"

[templates.claude-statusline]
input_path = "~/.config/matugen/templates/claude-statusline.sh"
output_path = "~/.cache/matugen/claude-statusline.sh"

# JDownloader (Flatpak): Grundfarben fürs dunkle FlatLaf-Theme (lädt der
# Java-Agent dms-flatlaf-agent.jar, Quelle ~/.local/share/jdownloader-dms)
# und JDownloaders eigene Tabellen-/Flächenfarben. Wirkt beim nächsten Start.
[templates.jdownloader-flatlaf]
input_path = "~/.config/matugen/templates/jdownloader-flatlaf.properties"
output_path = "~/.var/app/org.jdownloader.JDownloader/data/jdownloader-dms/FlatDarkLaf.properties"

[templates.jdownloader-laf]
input_path = "~/.config/matugen/templates/jdownloader-laf.json"
output_path = "~/.var/app/org.jdownloader.JDownloader/data/jdownloader/cfg/laf/FlatDarkLaf.json"
