# Starship – aus ~/.config/matugen/templates/starship.toml erzeugt (Farben aus dem
# Hintergrundbild). Änderungen an der Vorlage machen, nicht hier.

format = """
[]({{colors.primary_container.dark.hex}})\
$os\
$username\
[](bg:{{colors.secondary_container.dark.hex}} fg:{{colors.primary_container.dark.hex}})\
$directory\
[](fg:{{colors.secondary_container.dark.hex}} bg:{{colors.tertiary_container.dark.hex}})\
$git_branch\
$git_status\
[](fg:{{colors.tertiary_container.dark.hex}} bg:{{colors.surface_container_highest.dark.hex}})\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:{{colors.surface_container_highest.dark.hex}} bg:{{colors.surface_container_high.dark.hex}})\
$docker_context\
[](fg:{{colors.surface_container_high.dark.hex}} bg:{{colors.surface_container.dark.hex}})\
$time\
[ ](fg:{{colors.surface_container.dark.hex}})\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:{{colors.primary_container.dark.hex}}"
style_root = "bg:{{colors.primary_container.dark.hex}}"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:{{colors.primary_container.dark.hex}}"
disabled = false # Disabled by default

[directory]
style = "bg:{{colors.secondary_container.dark.hex}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Devel" = "Ꙭ  "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:{{colors.surface_container_high.dark.hex}}"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:{{colors.tertiary_container.dark.hex}}"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:{{colors.tertiary_container.dark.hex}}"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:{{colors.surface_container_highest.dark.hex}}"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:{{colors.surface_container.dark.hex}}"
format = '[ ♥ $time ]($style)'
