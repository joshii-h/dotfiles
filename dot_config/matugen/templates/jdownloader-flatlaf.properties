# JDownloader (Flatpak) – FlatLaf-Grundfarben aus dem Hintergrundbild (matugen/DMS).
# Wird beim Start von JDownloader über den Java-Agenten dms-flatlaf-agent.jar geladen.
@background = {{colors.surface_container.dark.hex}}
@foreground = {{colors.on_surface.dark.hex}}
@disabledForeground = {{colors.outline.dark.hex}}
@componentBackground = {{colors.surface_container_low.dark.hex}}
@buttonBackground = {{colors.surface_container_high.dark.hex}}
@menuBackground = {{colors.surface_container_high.dark.hex}}
@accentColor = {{colors.primary.dark.hex}}
@selectionBackground = {{colors.primary_container.dark.hex}}
@selectionForeground = {{colors.on_primary_container.dark.hex}}
@selectionInactiveBackground = {{colors.surface_container_highest.dark.hex}}
@selectionInactiveForeground = {{colors.on_surface.dark.hex}}
@icon = {{colors.on_surface_variant.dark.hex}}

Component.borderColor = {{colors.outline_variant.dark.hex}}
Component.focusedBorderColor = {{colors.primary.dark.hex}}
Component.focusColor = {{colors.primary.dark.hex}}
Separator.foreground = {{colors.outline_variant.dark.hex}}
Button.default.background = {{colors.primary.dark.hex}}
Button.default.foreground = {{colors.on_primary.dark.hex}}
Table.background = {{colors.surface_container_low.dark.hex}}
TableHeader.background = {{colors.surface_container.dark.hex}}
TableHeader.separatorColor = {{colors.outline_variant.dark.hex}}
TableHeader.bottomSeparatorColor = {{colors.outline_variant.dark.hex}}
ToolTip.background = {{colors.surface_container_highest.dark.hex}}
ToolTip.foreground = {{colors.on_surface.dark.hex}}
ProgressBar.foreground = {{colors.primary.dark.hex}}
ProgressBar.background = {{colors.surface_container_highest.dark.hex}}
ScrollBar.track = {{colors.surface_container_low.dark.hex}}
ScrollBar.thumb = {{colors.outline_variant.dark.hex}}
ScrollBar.hoverThumbColor = {{colors.outline.dark.hex}}

# Formen wie in GTK/libadwaita: abgerundet, schmale Rollbalken
Component.arc = 12
Button.arc = 12
TextComponent.arc = 12
CheckBox.arc = 6
ProgressBar.arc = 8
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 12

# Schrift wie auf dem Desktop
defaultFont = "Google Sans Flex"
