# Standalone SearXNG — entkoppelt von Odysseus (das wird entfernt).
# Reines Such-Backend für media-mcp deep_research + Hermes web_search.
# chezmoi-managed: ai/searxng/docker-compose.yml
services:
  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "1"}
